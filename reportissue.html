<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report an Issue | CivicFix</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">

    <style>
        :root {
            --ink: #23372e;
            --leaf: #426856;
            --lime: #c9dc8d;
            --clay: #b86746;
            --cream: #f4f0e6;
            --dark: #294635;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "DM Sans", sans-serif;
            background: var(--cream);
            color: var(--ink);
            min-height: 100vh;
        }

        .backdrop {
            position: fixed;
            inset: 0;
            z-index: -2;

            background:
                linear-gradient(120deg,
                    rgba(17, 40, 30, .35),
                    rgba(36, 68, 52, .20)),
                url('https://images.unsplash.com/photo-1518005020951-eccb494ad742?auto=format&fit=crop&w=2200&q=85') center/cover;
        }

        .backdrop::after {
            content: "";
            position: absolute;
            inset: 0;

            background:
                linear-gradient(180deg,
                    rgba(28, 52, 42, .10),
                    rgba(244, 240, 230, .99) 85%);
        }

        nav {
            position: fixed;
            top: 18px;
            left: 50%;
            transform: translateX(-50%);

            width: min(1120px, calc(100% - 32px));
            height: 68px;

            display: flex;
            align-items: center;
            justify-content: space-between;

            padding: 0 22px;

            border-radius: 22px;

            background: rgba(34, 58, 46, .75);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(255, 255, 255, .30);

            z-index: 100;

            color: white;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;

            color: white;
            text-decoration: none;

            font-size: 20px;
            font-weight: 700;
        }

        .mark {
            width: 32px;
            height: 32px;

            display: grid;
            place-items: center;

            background: var(--lime);
            color: var(--ink);

            border-radius: 10px 10px 10px 2px;
        }

        .back-link {
            color: rgba(255, 255, 255, .85);
            text-decoration: none;

            font-weight: 600;
            font-size: 14px;
        }

        .back-link:hover {
            color: var(--lime);
        }

        .page {
            width: min(850px, calc(100% - 32px));

            margin: auto;

            padding: 140px 0 70px;
        }

        .page-header {
            text-align: center;
            margin-bottom: 28px;
        }

        .page-header span {
            color: var(--clay);

            font-size: 13px;
            font-weight: 700;

            text-transform: uppercase;
            letter-spacing: .12em;
        }

        .page-header h1 {
            margin: 10px 0;

            font-family: "Playfair Display", serif;

            font-size: clamp(38px, 5vw, 60px);

            color: var(--ink);
        }

        .page-header p {
            margin: auto;

            max-width: 600px;

            color: #ffffff;

            line-height: 1.6;
        }

        .form-card {
            padding: 35px;

            border-radius: 28px;

            background: rgba(255, 255, 255, .98);

            backdrop-filter: blur(18px);

            border: 1px solid rgba(61, 91, 70, .12);

            box-shadow:
                0 25px 60px rgba(25, 50, 38, .12);
        }

        .form-grid {
            display: grid;

            grid-template-columns:
                repeat(2, 1fr);

            gap: 20px;
        }

        .full {
            grid-column: 1 / -1;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        label {
            font-size: 14px;
            font-weight: 700;
            color: var(--ink);
        }

        input,
        select,
        textarea {
            width: 100%;

            padding: 14px 15px;

            border-radius: 12px;

            border:
                1px solid rgba(61, 91, 70, .18);

            background:
                rgba(255, 255, 255, .85);

            font-family: inherit;
            font-size: 14px;

            outline: none;

            transition: .25s;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: var(--leaf);

            box-shadow:
                0 0 0 4px rgba(66, 104, 86, .10);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        .upload-box {
            border:
                2px dashed rgba(66, 104, 86, .35);

            border-radius: 18px;

            padding: 30px;

            text-align: center;

            cursor: pointer;

            transition: .25s;

            background:
                rgba(201, 220, 141, .12);
        }

        .upload-box:hover {
            background:
                rgba(201, 220, 141, .25);

            border-color:
                var(--leaf);
        }

        .upload-icon {
            font-size: 42px;
        }

        .upload-box h3 {
            margin: 10px 0 5px;
        }

        .upload-box p {
            margin: 0;

            color: #718078;

            font-size: 13px;
        }

        #imageInput {
            display: none;
        }

        #imagePreview {
            width: 100%;

            max-height: 280px;

            object-fit: cover;

            border-radius: 18px;

            margin-top: 15px;

            display: none;
        }

        .submit-button {
            width: 100%;

            margin-top: 25px;

            padding: 16px;

            border: none;

            border-radius: 14px;

            background: var(--dark);

            color: white;

            font-family: inherit;

            font-size: 16px;

            font-weight: 700;

            cursor: pointer;

            transition: .25s;
        }

        .submit-button:hover {
            background: var(--leaf);

            transform: translateY(-3px);

            box-shadow:
                0 12px 30px rgba(66, 104, 86, .25);
        }

        .submit-button:disabled {
            opacity: .65;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            display: none;

            margin-top: 18px;

            padding: 14px;

            border-radius: 12px;

            text-align: center;

            font-weight: 600;
        }

        .success {
            display: block;

            background:
                rgba(201, 220, 141, .45);

            color: var(--dark);
        }

        .error {
            display: block;

            background:
                rgba(184, 103, 70, .15);

            color: #8a3f25;
        }

        @media(max-width:650px) {

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full {
                grid-column: auto;
            }

            .form-card {
                padding: 22px;
            }

        }

        /* CivicFix Back Button */
        .civicfix-back-btn {
            position: fixed;
            top: 18px;
            left: 18px;
            z-index: 10000;
            display: inline-flex;
            align-items: center;
            gap: 7px;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, .35);
            border-radius: 12px;
            background: rgba(35, 55, 46, .82);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: #fff;
            text-decoration: none;
            font: 700 13px/1 "DM Sans", sans-serif;
            box-shadow: 0 8px 22px rgba(0, 0, 0, .14);
            transition: .2s;
        }

        .civicfix-back-btn:hover {
            transform: translateY(-2px);
            background: rgba(35, 55, 46, .95);
        }

        .civicfix-back-btn:active {
            transform: translateY(0);
        }

        @media(max-width:650px) {
            .civicfix-back-btn {
                top: 12px;
                left: 12px;
                padding: 9px 12px;
                font-size: 12px;
            }
        }


        /* =========================================================
   CIVICFIX MOBILE RESPONSIVE LAYER
   Desktop layout/functionality is intentionally unchanged.
========================================================= */
        @media (max-width: 650px) {

            html,
            body {
                width: 100%;
                max-width: 100%;
                overflow-x: hidden;
            }

            img,
            svg,
            video,
            canvas {
                max-width: 100%;
            }

            nav {
                width: calc(100% - 20px);
                top: 10px;
                min-height: 60px;
                height: auto;
                padding: 9px 14px;
            }

            .brand {
                font-size: 18px;
            }

            .mark {
                width: 29px;
                height: 29px;
            }

            .back-link {
                font-size: 12px;
                white-space: nowrap;
            }

            .page {
                width: calc(100% - 24px);
                padding: 94px 0 45px;
            }

            .page-header {
                margin-bottom: 20px;
            }

            .page-header h1 {
                font-size: clamp(38px, 12vw, 54px);
            }

            .page-header p {
                font-size: 14px;
            }

            .form-card {
                width: 100%;
                padding: 20px 15px;
                border-radius: 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .full {
                grid-column: auto;
            }

            input,
            select,
            textarea {
                min-height: 46px;
                font-size: 16px;
            }

            textarea {
                min-height: 130px;
            }

            .upload-box {
                padding: 24px 14px;
            }

            .submit-button {
                width: 100%;
                min-height: 48px;
            }

            #imagePreview {
                max-height: 260px;
                object-fit: contain;
            }

            .civicfix-back-btn {
                top: 10px;
                left: 10px;
                padding: 8px 10px;
                font-size: 11px;
            }
        }



        /* CIVICFIX PAGE OPEN ANIMATION */
        @keyframes civicfixPageFadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
                filter: blur(3px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        body {
            animation: civicfixPageFadeIn .65s cubic-bezier(.22, 1, .36, 1) both;
        }

        @media (max-width: 650px) {
            nav {
                width: calc(100% - 20px);
                gap: 8px;
            }

            .back-link {
                font-size: 12px;
                white-space: nowrap;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            body {
                animation: none !important;
            }
        }
    </style>
</head>

<body>

    <a href="index.html" class="civicfix-back-btn" onclick="if(history.length>1){history.back();return false;}"
        aria-label="Go back">← Back</a>

    <div class="backdrop"></div>

    <nav>
        <a href="index.html" class="brand">
            <span class="mark">✦</span>
            CivicFix
        </a>

        <a href="index.html" class="back-link">
            ← Back to Home
        </a>
    </nav>

    <main class="page">

        <div class="page-header">

            <span>
                CivicFix Reporting
            </span>

            <h1>
                Report an Issue
            </h1>

            <p>
                Help make your neighbourhood better.
                Upload the details of the problem and
                we'll help bring it to attention.
            </p>

        </div>

        <div class="form-card">

            <form id="reportForm">

                <div class="form-grid">

                    <!-- NAME -->
                    <div class="field">

                        <label for="name">
                            Your Name
                        </label>

                        <input type="text" id="name" placeholder="Enter your name" required>

                    </div>

                    <!-- ISSUE TYPE -->
                    <div class="field">

                        <label for="issueType">
                            Issue Type
                        </label>

                        <select id="issueType" required>

                            <option value="">
                                Select issue type
                            </option>

                            <option value="Pothole">
                                🕳️ Pothole
                            </option>

                            <option value="Streetlight">
                                💡 Streetlight
                            </option>

                            <option value="Garbage">
                                🗑️ Garbage / Waste
                            </option>

                            <option value="Water">
                                💧 Water Problem
                            </option>

                            <option value="Road">
                                🛣️ Road Damage
                            </option>

                            <option value="Other">
                                ⚠️ Other
                            </option>

                        </select>

                    </div>

                    <!-- LOCATION -->
                    <div class="field full">

                        <label for="location">
                            Location
                        </label>

                        <input type="text" id="location" placeholder="Enter issue location" required>

                    </div>

                    <!-- IMAGE -->
                    <div class="field full">

                        <label>
                            Upload Image
                        </label>

                        <label for="imageInput" class="upload-box">

                            <div class="upload-icon">
                                📸
                            </div>

                            <h3>
                                Upload a photo
                            </h3>

                            <p>
                                On phone: take a photo with your camera or choose one from your gallery
                            </p>

                        </label>

                        <input type="file" id="imageInput" accept="image/*" capture="environment" required>

                        <img id="imagePreview" alt="Image Preview">

                    </div>

                    <!-- DESCRIPTION -->
                    <div class="field full">

                        <label for="description">
                            Description
                        </label>

                        <textarea id="description" placeholder="Describe the issue in detail..." required></textarea>

                    </div>

                </div>

                <button type="submit" class="submit-button" id="submitButton">
                    Submit Report 🚀
                </button>

                <div id="message" class="message"></div>

            </form>

        </div>

    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        const SUPABASE_URL = "https://avxcoioegrebgjyauzjh.supabase.co";
        const SUPABASE_ANON_KEY = "sb_publishable_eab9fQepYwpTR6jNV05q3Q_wG7_V1Zi";

        const supabaseClient = supabase.createClient(
            SUPABASE_URL,
            SUPABASE_ANON_KEY
        );

        const PENDING_REPORT_KEY = "civicfix-pending-report";

        const reportForm = document.getElementById("reportForm");
        const submitButton = document.getElementById("submitButton");
        const message = document.getElementById("message");
        const imageInput = document.getElementById("imageInput");
        const imagePreview = document.getElementById("imagePreview");

        function showMessage(text, type = "") {
            message.textContent = text;
            message.className = type ? "message " + type : "message";
        }

        function getReportValues() {
            return {
                name: document.getElementById("name").value.trim(),
                issueType: document.getElementById("issueType").value,
                location: document.getElementById("location").value.trim(),
                description: document.getElementById("description").value.trim()
            };
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();

                reader.onload = () => resolve(reader.result);

                reader.onerror = () =>
                    reject(reader.error || new Error("Could not read image."));

                reader.readAsDataURL(file);
            });
        }

        async function prepareImage(file) {
            if (!file) return null;

            const dataUrl = await readFileAsDataUrl(file);

            return new Promise((resolve) => {

                const img = new Image();

                img.onload = () => {

                    const maxSize = 1600;

                    const scale = Math.min(
                        1,
                        maxSize / Math.max(img.width, img.height)
                    );

                    const width = Math.max(
                        1,
                        Math.round(img.width * scale)
                    );

                    const height = Math.max(
                        1,
                        Math.round(img.height * scale)
                    );

                    const canvas = document.createElement("canvas");

                    canvas.width = width;
                    canvas.height = height;

                    canvas
                        .getContext("2d")
                        .drawImage(img, 0, 0, width, height);

                    resolve({
                        name: file.name,
                        type: "image/jpeg",
                        dataUrl: canvas.toDataURL("image/jpeg", 0.80)
                    });
                };

                img.onerror = () => resolve({
                    name: file.name,
                    type: file.type || "image/jpeg",
                    dataUrl
                });

                img.src = dataUrl;
            });
        }

        async function savePendingReport() {

            const pendingReport = getReportValues();

            const imageFile = imageInput.files[0];

            if (imageFile) {
                pendingReport.image = await prepareImage(imageFile);
            }

            sessionStorage.setItem(
                PENDING_REPORT_KEY,
                JSON.stringify(pendingReport)
            );
        }

        async function submitReportDirectly(user) {

            const pending = getReportValues();

            if (
                !pending.name ||
                !pending.issueType ||
                !pending.location ||
                !pending.description
            ) {
                throw new Error("Please complete all required fields.");
            }

            let imageUrl = null;

            const imageFile = imageInput.files[0];

            if (imageFile) {

                const safeName = imageFile.name.replace(
                    /[^a-zA-Z0-9._-]/g,
                    "-"
                );

                const fileName =
                    `${Date.now()}-${crypto.randomUUID()}-${safeName}`;

                const { error: uploadError } =
                    await supabaseClient
                        .storage
                        .from("issue-images")
                        .upload(
                            fileName,
                            imageFile,
                            {
                                upsert: false
                            }
                        );

                if (uploadError) {
                    throw uploadError;
                }

                const { data: publicUrlData } =
                    supabaseClient
                        .storage
                        .from("issue-images")
                        .getPublicUrl(fileName);

                imageUrl =
                    publicUrlData?.publicUrl || null;
            }

            const { error: reportError } =
                await supabaseClient
                    .from("reports")
                    .insert([{
                        name: pending.name,
                        issue_type: pending.issueType,
                        location: pending.location,
                        description: pending.description,
                        image_url: imageUrl,
                        status: "Pending",
                        user_id: user.id
                    }]);

            if (reportError) {
                throw reportError;
            }
        }

        const isMobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);

        if (isMobile) {
            imageInput.setAttribute("capture", "environment");
        } else {
            imageInput.removeAttribute("capture");
        }

        imageInput.addEventListener("change", function () {

            const file = this.files[0];

            if (!file) {
                imagePreview.style.display = "none";
                return;
            }

            imagePreview.src = URL.createObjectURL(file);
            imagePreview.style.display = "block";
        });

        reportForm.addEventListener("submit", async function (event) {

            event.preventDefault();

            if (!reportForm.checkValidity()) {
                reportForm.reportValidity();
                return;
            }

            submitButton.disabled = true;
            submitButton.textContent = "Checking login...";
            showMessage("");

            try {

                /*
                 * First check whether the user is already logged in.
                 */
                const {
                    data: userData,
                    error: userError
                } = await supabaseClient.auth.getUser();

                const user = userData?.user;

                /*
                 * ALREADY LOGGED IN:
                 * Submit directly without opening login.html.
                 */
                if (!userError && user) {

                    submitButton.textContent = "Submitting report...";

                    await submitReportDirectly(user);

                    showMessage(
                        "Report submitted successfully! 🚀",
                        "success"
                    );

                    submitButton.textContent = "Report Submitted ✓";

                    /*
                     * Show a pop-up confirmation, then return to dashboard.
                     */
                    alert("Report submitted successfully!");

                    window.location.replace("dashbaord.html");

                    return;
                }

                /*
                 * NOT LOGGED IN:
                 * Keep the existing working workflow.
                 */
                submitButton.textContent = "Preparing report...";

                await savePendingReport();

                window.location.replace(
                    "login.html?returnTo=reportissue"
                );

            } catch (error) {

                console.error(
                    "Report submission failed:",
                    error
                );

                showMessage(
                    error?.message ||
                    "Could not submit your report.",
                    "error"
                );

                submitButton.disabled = false;
                submitButton.textContent =
                    "Submit Report 🚀";
            }
        });
    </script>

</body>

</html>
